<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tiercraft</title>
  <meta name="description" content="Classez tout, de S à D : créez et partagez vos tier lists sur iPhone.">
  <meta property="og:title" content="Tiercraft">
  <meta property="og:description" content="Créez et partagez vos tier lists sur iPhone.">
  <meta property="og:image" content="/icon.png">
  <meta name="apple-itunes-app" content="app-id=6822017061">
  <link rel="icon" href="/icon.png">
  <style>
    :root { color-scheme: dark; --bg: #0F1115; --text: #F2F4F8; --muted: #9AA3B2; --primary: #7C5CFF; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; text-align: center; }
    .icon { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 32px; margin: 20px 0 8px; }
    .strip { display: flex; gap: 4px; margin: 0 auto 16px; max-width: 220px; }
    .strip span { flex: 1; height: 4px; border-radius: 2px; }
    p { color: var(--muted); margin: 0 0 24px; }
    .links { margin-top: 24px; font-size: 14px; }
    .links a { color: var(--muted); }
    .btn { display: block; padding: 14px 18px; border-radius: 12px; font-weight: 600; text-decoration: none; background: var(--primary); color: #fff; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/icon.png" alt="">
    <h1>Tiercraft</h1>
    <div class="strip"><span style="background:#FF7F7F"></span><span style="background:#FFBF7F"></span><span style="background:#FFDF7F"></span><span style="background:#FFFF7F"></span><span style="background:#BFFF7F"></span></div>
    <p>Créez vos tier lists, classez tout de S à D et partagez-les avec vos amis.</p>
    <a class="btn" href="https://apps.apple.com/app/id6822017061">Télécharger sur l’App Store</a>
    <p class="links"><a href="/support">Assistance</a> · <a href="/confidentialite">Confidentialité</a></p>
  </main>
</body>
</html>
