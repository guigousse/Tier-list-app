<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Éditeur des listes du jour</title>
<link rel="icon" href="/icon.png">
<style>
  :root {
    --bg: #0B0C12; --surface: #181B22; --surface-2: #20242D; --border: #2C313C;
    --text: #F2F4F8; --muted: #9AA3B2; --primary: #7C5CFF; --primary-2: #A98BFF;
    --ok: #6EE7A8; --warn: #FFD43B; --bad: #FF7F7F; --ai: linear-gradient(90deg, #8A6BFF, #FF7FA0);
    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); }
  button, input, select, textarea { font: inherit; color: inherit; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
  input:disabled { opacity: .55; }
  button { cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; font-weight: 600; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--primary-2); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.ai { background: var(--ai); border: 0; color: #fff; }
  button.danger { color: var(--bad); }
  button.icon { padding: 6px 9px; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 12px 16px; background: rgba(11,12,18,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0 auto 0 0; }
  header input { width: 260px; max-width: 100%; }
  main { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 62px); }
  aside { border-right: 1px solid var(--border); overflow-y: auto; max-height: calc(100vh - 62px); position: sticky; top: 62px; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; max-height: 34vh; border-right: 0; border-bottom: 1px solid var(--border); }
  }
  .day { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: none; padding: 9px 14px; font-weight: 500; }
  .day:hover { background: var(--surface); }
  .day.sel { background: var(--surface-2); box-shadow: inset 3px 0 var(--primary); }
  .day .date { width: 64px; flex: none; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .day .date b { display: block; color: var(--text); font-size: 14px; }
  .day .what { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .day .empty { color: var(--muted); font-style: italic; }
  .day.today .date b { color: var(--primary-2); }
  .dots { display: flex; gap: 3px; flex: none; }
  .dot { font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
  .dot.warn { color: var(--warn); } .dot.bad { color: var(--bad); } .dot.ok { color: var(--ok); }
  section.editor { padding: 18px 16px 120px; max-width: 980px; width: 100%; }
  .box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px; margin: 0 0 14px; }
  .box h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .box h2 .right { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; text-transform: none; letter-spacing: 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  .grow { flex: 1 1 200px; }
  .title-line { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin: 0 0 12px; }
  .title-line h2 { margin: 0; font-size: 22px; }
  .banner { border-radius: 12px; padding: 9px 12px; margin: 0 0 14px; font-size: 14px; }
  .banner.warn { background: rgba(255,212,59,.1); color: var(--warn); }
  .banner.bad { background: rgba(255,127,127,.1); color: var(--bad); }
  .banner.info { background: rgba(124,92,255,.12); color: var(--primary-2); }
  .cards { display: grid; gap: 6px; }
  .card { display: grid; grid-template-columns: 26px 44px 3.4em 1fr 1fr auto; gap: 6px; align-items: center; }
  .card .n { color: var(--muted); font-size: 12px; text-align: right; }
  .card .pic { width: 44px; height: 44px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 22px; position: relative; cursor: pointer; border: 2px solid transparent; }
  .card .pic.cover { border-color: var(--warn); }
  .card .pic img { width: 40px; height: 40px; object-fit: contain; }
  .card .pic small { position: absolute; right: -4px; bottom: -4px; font-size: 11px; }
  .card .emo { text-align: center; padding: 8px 2px; }
  .card .tools { display: flex; gap: 4px; }
  @media (max-width: 640px) {
    .card { grid-template-columns: 22px 44px 3em 1fr; }
    .card .concept { grid-column: 3 / 5; }
    .card .tools { grid-column: 2 / 5; }
  }
  .tr { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .tr .lang { display: grid; gap: 6px; align-content: start; }
  .tr .lang b { font-size: 13px; }
  .ideas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .ideas button { font-weight: 500; text-align: left; white-space: normal; }
  .ideas small { color: var(--muted); display: block; }
  .muted { color: var(--muted); font-size: 13px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(11,12,18,.95); border-top: 1px solid var(--border); }
  #status { flex: 1 1 200px; font-size: 14px; color: var(--muted); }
  #status.bad { color: var(--bad); } #status.ok { color: var(--ok); }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--primary-2); border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes s { to { transform: rotate(360deg); } }
  .center { padding: 60px 20px; text-align: center; color: var(--muted); }
  details summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>📅 Listes du jour · éditeur</h1>
  <input id="key" type="password" placeholder="Clé admin" autocomplete="off">
  <button id="load" class="primary">Charger</button>
</header>
<main>
  <aside id="days"><div class="center">Entre ta clé admin puis « Charger ».</div></aside>
  <section class="editor" id="editor"></section>
</main>
<footer>
  <span id="status">Prêt.</span>
  <button id="delete" class="danger" disabled>Supprimer</button>
  <button id="save" class="primary" disabled>Enregistrer</button>
</footer>

<script>
// Talks to the Edge Function daily-admin (supabase/functions/daily-admin), which checks
// the admin key on every request. The key stays in this browser only.
const API = 'https://mefhdtpyhtvplpfleyhi.supabase.co/functions/v1/daily-admin';
const PUBLISHABLE = 'sb_publishable_3nkx7nvNVBbfy4Q_sqEf3w_WXELIyYP';
const LANGS = { en: '🇺🇸 Anglais', es: '🇪🇸 Espagnol', el: '🇬🇷 Grec' };
const PAST = 7, AHEAD = 120;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

const state = { rows: new Map(), icons: {}, wishlist: new Set(), selected: null, draft: null, dirty: false, busy: false, ideas: [] };

// ---------- Days ----------
const addDays = (d, n) => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + n); return t.toISOString().slice(0, 10); };
/** The daily list on show: it comes out at 12:30 Paris time (src/lib/dailyClock.ts). */
function dailyDay() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Paris', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).map((x) => [x.type, x.value]));
  const day = `${p.year}-${p.month}-${p.day}`;
  return +p.hour * 60 + +p.minute < 750 ? addDays(day, -1) : day;
}
const longDate = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
const shortDate = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' });

// ---------- Cards ----------
/** "🦁 Lion" -> { emoji: "🦁", text: "Lion" } (same rule as lists.ts). */
function splitLabel(item) {
  const m = /^(\S+)\s+(.+)$/su.exec(String(item).trim());
  if (m && !/[\p{L}\p{N}]/u.test(m[1])) return { emoji: m[1], text: m[2].trim() };
  return { emoji: '', text: String(item).trim() };
}
const joinLabel = (emoji, text) => (emoji.trim() ? `${emoji.trim()} ${text.trim()}` : text.trim());

function draftOf(day) {
  const r = state.rows.get(day);
  const tr = {};
  for (const lang of Object.keys(LANGS)) {
    const t = r?.translations?.[lang];
    tr[lang] = { title: t?.title ?? '', description: t?.description ?? '', items: (r?.items ?? []).map((_, i) => (t?.items?.[i] != null ? splitLabel(t.items[i]).text : '')) };
  }
  return {
    day, exists: !!r, votes: r?.votes ?? 0,
    title: r?.title ?? '', emoji: r?.emoji ?? '', description: r?.description ?? '',
    cards: (r?.items ?? []).map((it, i) => ({ ...splitLabel(it), concept: r.concepts?.[i] ?? '' })),
    cover: r?.cover ?? 0,
    regions: (r?.regions ?? []).join(', '), vote_regions: (r?.vote_regions ?? []).join(', '),
    theme: r?.title ?? '', count: 12, tr,
  };
}

// ---------- Server ----------
async function call(body) {
  const res = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: PUBLISHABLE, 'x-admin-secret': $('key').value.trim() },
    body: JSON.stringify(body),
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(out.error || `Erreur ${res.status}`);
  return out;
}

function status(text, kind = '') {
  $('status').className = kind;
  $('status').innerHTML = kind === 'busy' ? `<span class="spin"></span>${esc(text)}` : esc(text);
}

/** Runs one request with the buttons locked; `done` is shown when it went well. */
async function task(label, run, done) {
  if (state.busy) return;
  state.busy = true;
  document.body.querySelectorAll('button').forEach((b) => (b.dataset.was = b.disabled, b.disabled = true));
  status(label, 'busy');
  try {
    await run();
    status(done || 'Fait.', 'ok');
  } catch (e) {
    status(e.message || String(e), 'bad');
  } finally {
    state.busy = false;
    document.body.querySelectorAll('button').forEach((b) => (b.disabled = b.dataset.was === 'true'));
    renderEditor();
  }
}

async function load(keepSelection = true) {
  const today = dailyDay();
  const out = await call({ action: 'list', from: addDays(today, -PAST), to: addDays(today, AHEAD) });
  state.rows = new Map(out.days.map((d) => [d.day, d]));
  Object.assign(state.icons, out.icons);
  state.wishlist = new Set(out.wishlist);
  store.set('tiercraft-admin-key', $('key').value.trim());
  renderDays();
  if (!keepSelection || !state.selected) {
    const first = Array.from({ length: AHEAD }, (_, i) => addDays(today, i + 1)).find((d) => !state.rows.has(d)) ?? addDays(today, 1);
    select(state.rows.has(addDays(today, 1)) ? addDays(today, 1) : first, true);
  }
}

// ---------- Sidebar ----------
function badges(r) {
  if (!r) return '';
  const out = [];
  const missingTr = Object.keys(LANGS).filter((l) => !r.translations?.[l]).length;
  if (missingTr) out.push(`<span class="dot warn" title="Traductions manquantes">🌍 −${missingTr}</span>`);
  const noPic = r.items.filter((_, i) => !state.icons[r.concepts?.[i]]).length;
  if (noPic) out.push(`<span class="dot ${noPic > r.items.length / 2 ? 'warn' : ''}" title="Cartes sans image">🖼 −${noPic}</span>`);
  if (r.votes) out.push(`<span class="dot ok" title="Votes : cartes verrouillées">🔒 ${r.votes}</span>`);
  return `<span class="dots">${out.join('')}</span>`;
}

function renderDays() {
  const today = dailyDay();
  let html = '';
  for (let i = -PAST; i <= AHEAD; i++) {
    const d = addDays(today, i);
    const r = state.rows.get(d);
    const [wd, dm] = [new Date(d + 'T12:00:00Z').toLocaleDateString('fr-FR', { weekday: 'short', timeZone: 'UTC' }), new Date(d + 'T12:00:00Z').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', timeZone: 'UTC' })];
    html += `<button class="day${d === state.selected ? ' sel' : ''}${d === today ? ' today' : ''}" data-day="${d}">
      <span class="date"><b>${esc(dm)}</b>${esc(wd)}${d === today ? ' · auj.' : ''}</span>
      <span class="what">${r ? `${esc(r.emoji)} ${esc(r.title)}` : '<span class="empty">— vide —</span>'}</span>${badges(r)}</button>`;
  }
  $('days').innerHTML = html;
  $('days').querySelectorAll('.day').forEach((b) => b.addEventListener('click', () => select(b.dataset.day)));
  $('days').querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
}

function select(day, force = false) {
  if (!force && state.dirty && day !== state.selected && !confirm('Des modifications ne sont pas enregistrées. Les abandonner ?')) return;
  state.selected = day;
  state.draft = draftOf(day);
  state.dirty = false;
  state.ideas = [];
  renderDays();
  renderEditor();
}

// ---------- Editor ----------
function touch() { state.dirty = true; $('save').disabled = state.busy; }

function picture(c, i) {
  const d = state.draft;
  const url = state.icons[c.concept];
  const mark = url ? '' : c.concept ? (state.wishlist.has(c.concept) ? '<small title="En attente de dessin">⏳</small>' : '<small title="Sera ajouté à la file de dessin à l’enregistrement">🆕</small>') : '';
  return `<div class="pic${i === d.cover ? ' cover' : ''}" data-cover="${i}" title="${i === d.cover ? 'Image de la liste sur l’accueil' : 'Choisir comme image de la liste'}">${url ? `<img src="${esc(url)}" alt="">` : esc(c.emoji || '·')}${mark}</div>`;
}

function renderEditor() {
  const d = state.draft;
  const el = $('editor');
  if (!d) { el.innerHTML = ''; return; }
  const today = dailyDay();
  const locked = d.votes > 0;
  const missing = d.cards.filter((c) => !state.icons[c.concept]).length;
  const banners = [];
  if (locked) banners.push(`<div class="banner bad">🔒 ${d.votes} vote(s) : les cartes sont verrouillées (les votes sont rangés dans leur ordre). Titre, description, concepts et traductions restent modifiables.</div>`);
  else if (d.day <= today) banners.push(`<div class="banner warn">Cette liste est déjà en ligne : des joueurs l’ont peut-être déjà classée telle quelle.</div>`);
  else if (d.day === addDays(today, 1)) banners.push(`<div class="banner info">C’est la liste de demain : elle sort à 12 h 30 (heure de Paris).</div>`);
  const ideas = state.ideas.map((x, i) => `<button data-idea="${i}">${esc(x.emoji)} ${esc(x.title)}<small>${esc(x.description)}</small></button>`).join('');
  el.innerHTML = `
    <div class="title-line"><h2>${esc(longDate(d.day))}</h2><span class="muted">${d.exists ? 'liste existante' : 'nouvelle liste'}${state.dirty ? ' · modifiée' : ''}</span></div>
    ${banners.join('')}
    <div class="box">
      <h2>✨ Générer avec l’IA</h2>
      <div class="row">
        <input class="grow" id="theme" placeholder="Thème (ex. « Desserts de grand-mère »)" value="${esc(d.theme)}">
        <select id="count" title="Nombre de cartes">${[8, 9, 10, 11, 12, 13, 14, 15].map((n) => `<option${n === d.count ? ' selected' : ''}>${n}</option>`).join('')}</select>
        <button class="ai" id="generate" ${locked ? 'disabled' : ''}>Générer la liste</button>
        <button id="ideasBtn">💡 Idées de thèmes</button>
      </div>
      <label class="muted"><input type="checkbox" id="autoTr" ${store.get('tiercraft-auto-tr') === '0' ? '' : 'checked'}> traduire et dessiner les images manquantes automatiquement après la génération</label>
      ${ideas ? `<div class="ideas">${ideas}</div>` : ''}
    </div>
    <div class="box">
      <h2>Liste</h2>
      <div class="row">
        <input id="emoji" style="width:4em;text-align:center" placeholder="📅" value="${esc(d.emoji)}" title="Emoji de la liste">
        <input class="grow" id="title" placeholder="Titre" maxlength="60" value="${esc(d.title)}">
      </div>
      <div class="row"><input class="grow" id="description" placeholder="Description (une phrase courte)" maxlength="120" value="${esc(d.description)}"></div>
    </div>
    <div class="box">
      <h2>Cartes (${d.cards.length})
        <span class="right">
          <button id="addCard" ${locked ? 'disabled' : ''}>+ Carte</button>
          <button class="ai" id="moreCards" ${locked ? 'disabled' : ''}>✨ +2 cartes</button>
          <button class="ai" id="concepts" ${d.cards.length ? '' : 'disabled'} title="Propose un concept d’image pour les cartes qui n’en ont pas">✨ Concepts manquants</button>
          <button class="ai" id="draw" ${missing ? '' : 'disabled'} title="Dessine tout de suite les images qui manquent (bibliothèque partagée)">🎨 Dessiner ${missing || ''}</button>
        </span>
      </h2>
      <p class="muted" style="margin:0 0 8px">Emoji · nom · concept d’image (anglais, kebab-case). Clique sur une image pour en faire l’image de la liste (cadre jaune). ⏳ = en attente de dessin.</p>
      <div class="cards">${d.cards.map((c, i) => `
        <div class="card" data-i="${i}">
          <span class="n">${i + 1}</span>
          ${picture(c, i)}
          <input class="emo" data-f="emoji" value="${esc(c.emoji)}" ${locked ? 'disabled' : ''}>
          <input data-f="text" placeholder="Nom de la carte" maxlength="40" value="${esc(c.text)}" ${locked ? 'disabled' : ''}>
          <input class="concept" data-f="concept" placeholder="concept-image" maxlength="40" value="${esc(c.concept)}">
          <span class="tools">
            <button class="icon" data-act="up" ${locked || i === 0 ? 'disabled' : ''} title="Monter">↑</button>
            <button class="icon" data-act="down" ${locked || i === d.cards.length - 1 ? 'disabled' : ''} title="Descendre">↓</button>
            <button class="icon" data-act="replace" ${locked ? 'disabled' : ''} title="Remplacer par une carte de l’IA">✨</button>
            <button class="icon danger" data-act="remove" ${locked ? 'disabled' : ''} title="Supprimer">✕</button>
          </span>
        </div>`).join('') || '<p class="muted">Aucune carte : génère la liste avec l’IA ou ajoute des cartes.</p>'}
      </div>
    </div>
    <div class="box">
      <h2>Traductions <span class="right"><button class="ai" id="translate" ${d.cards.length && d.title ? '' : 'disabled'}>🌍 Tout traduire avec l’IA</button></span></h2>
      <p class="muted" style="margin:0 0 8px">Une langue laissée vide affiche le français. Les emojis des cartes sont repris automatiquement.</p>
      <div class="tr">${Object.entries(LANGS).map(([lang, name]) => `
        <div class="lang" data-lang="${lang}">
          <b>${name}</b>
          <input data-t="title" placeholder="Titre" value="${esc(d.tr[lang].title)}">
          <input data-t="description" placeholder="Description" value="${esc(d.tr[lang].description)}">
          ${d.cards.map((c, i) => `<input data-t="item" data-i="${i}" placeholder="${esc(c.emoji)} ${esc(c.text)}" value="${esc(d.tr[lang].items[i] ?? '')}">`).join('')}
        </div>`).join('')}
      </div>
    </div>
    <div class="box">
      <details>
        <summary>Avancé : déplacer, régions</summary>
        <div class="row" style="margin-top:10px">
          <span class="muted">Déplacer au</span><input type="date" id="moveTo" min="${addDays(today, 1)}">
          <button id="move" ${d.exists && !locked ? '' : 'disabled'}>Déplacer / échanger</button>
        </div>
        <p class="muted">Si ce jour-là a déjà une liste, les deux sont échangées.</p>
        <div class="row"><span class="muted" style="width:150px">Mise en avant (pays)</span><input class="grow" id="regions" placeholder="vide = partout (ex. FR, BE)" value="${esc(d.regions)}"></div>
        <div class="row"><span class="muted" style="width:150px">Vote réservé à</span><input class="grow" id="vote_regions" placeholder="vide = tout le monde" value="${esc(d.vote_regions)}"></div>
      </details>
    </div>`;
  $('save').disabled = state.busy || !state.dirty;
  $('delete').disabled = state.busy || !d.exists || locked;
  bindEditor();
}

function bindEditor() {
  const d = state.draft;
  const field = (id, key = id) => $(id)?.addEventListener('input', (e) => { d[key] = e.target.value; touch(); });
  field('emoji'); field('title'); field('description'); field('regions'); field('vote_regions');
  $('theme').addEventListener('input', (e) => (d.theme = e.target.value));
  $('count').addEventListener('change', (e) => (d.count = +e.target.value));
  $('autoTr').addEventListener('change', (e) => store.set('tiercraft-auto-tr', e.target.checked ? '1' : '0'));

  document.querySelectorAll('.card').forEach((row) => {
    const i = +row.dataset.i;
    row.querySelectorAll('input[data-f]').forEach((inp) => inp.addEventListener('input', (e) => {
      d.cards[i][inp.dataset.f] = e.target.value;
      touch();
      if (inp.dataset.f === 'concept') row.querySelector('.pic').outerHTML = picture(d.cards[i], i);
    }));
    row.querySelector('[data-act=up]').addEventListener('click', () => moveCard(i, i - 1));
    row.querySelector('[data-act=down]').addEventListener('click', () => moveCard(i, i + 1));
    row.querySelector('[data-act=remove]').addEventListener('click', () => removeCard(i));
    row.querySelector('[data-act=replace]').addEventListener('click', () => replaceCard(i));
  });
  document.querySelectorAll('.lang').forEach((box) => {
    const t = d.tr[box.dataset.lang];
    box.querySelectorAll('input').forEach((inp) => inp.addEventListener('input', (e) => {
      if (inp.dataset.t === 'item') t.items[+inp.dataset.i] = e.target.value; else t[inp.dataset.t] = e.target.value;
      touch();
    }));
  });
  document.querySelectorAll('[data-idea]').forEach((b) => b.addEventListener('click', () => {
    const x = state.ideas[+b.dataset.idea];
    d.theme = x.title;
    renderEditor();
    $('theme').focus();
  }));

  $('generate').addEventListener('click', generate);
  $('ideasBtn').addEventListener('click', ideas);
  $('addCard').addEventListener('click', () => { insertCard({ emoji: '', text: '', concept: '' }); renderEditor(); });
  $('moreCards').addEventListener('click', () => moreCards(2));
  $('concepts').addEventListener('click', concepts);
  $('draw').addEventListener('click', () => task('Dessin des images… (≈ 20 s)', drawMissing, 'Images dessinées.'));
  $('translate').addEventListener('click', () => task('Traduction…', translate, 'Traduit : vérifie puis enregistre.'));
  $('move').addEventListener('click', move);
}

// Every change of the cards keeps the translations aligned with them, by position.
function insertCard(card, at = state.draft.cards.length) {
  const d = state.draft;
  d.cards.splice(at, 0, card);
  for (const t of Object.values(d.tr)) t.items.splice(at, 0, '');
  touch();
}
function moveCard(from, to) {
  const d = state.draft;
  const swap = (a) => ([a[from], a[to]] = [a[to], a[from]]);
  swap(d.cards);
  for (const t of Object.values(d.tr)) swap(t.items);
  if (d.cover === from) d.cover = to; else if (d.cover === to) d.cover = from;
  touch(); renderEditor();
}
function removeCard(i) {
  const d = state.draft;
  d.cards.splice(i, 1);
  for (const t of Object.values(d.tr)) t.items.splice(i, 1);
  if (d.cover >= d.cards.length || d.cover === i) d.cover = 0; else if (d.cover > i) d.cover--;
  touch(); renderEditor();
}

const themeOf = () => (state.draft.theme || state.draft.title).trim();

// ---------- AI ----------
function generate() {
  const d = state.draft;
  if (!themeOf()) return status('Donne un thème.', 'bad');
  if (d.cards.length && !confirm('Remplacer toute la liste par une liste générée ?')) return;
  const auto = $('autoTr').checked;
  task('Génération de la liste… (≈ 30 s)', async () => {
    const out = await call({ action: 'generate', theme: themeOf(), count: d.count });
    Object.assign(d, { title: out.title, emoji: out.emoji, description: out.description, cover: out.cover });
    d.cards = out.cards.map((c) => ({ emoji: c.emoji, text: c.label, concept: c.concept }));
    for (const t of Object.values(d.tr)) Object.assign(t, { title: '', description: '', items: d.cards.map(() => '') });
    touch();
    renderEditor();
    if (auto) {
      status('Traduction…', 'busy');
      await translate();
      if (d.cards.some((c) => !state.icons[c.concept])) { status('Dessin des images manquantes… (≈ 20 s)', 'busy'); await drawMissing(); }
    }
  }, 'Liste générée : relis-la puis enregistre.');
}

function moreCards(n) {
  const d = state.draft;
  if (!themeOf()) return status('Donne un thème (ou un titre).', 'bad');
  task('Nouvelles cartes…', async () => {
    const out = await call({ action: 'cards', theme: themeOf(), count: n, existing: d.cards.map((c) => c.text) });
    out.cards.forEach((c) => insertCard({ emoji: c.emoji, text: c.label, concept: c.concept }));
  }, 'Cartes ajoutées (sans traduction : pense à traduire).');
}

function replaceCard(i) {
  const d = state.draft;
  if (!themeOf()) return status('Donne un thème (ou un titre).', 'bad');
  task('Nouvelle carte…', async () => {
    const out = await call({ action: 'cards', theme: themeOf(), count: 1, existing: d.cards.map((c) => c.text) });
    const c = out.cards[0];
    if (!c) throw new Error('L’IA n’a rien proposé.');
    d.cards[i] = { emoji: c.emoji, text: c.label, concept: c.concept };
    for (const t of Object.values(d.tr)) t.items[i] = '';
    touch();
  }, 'Carte remplacée (sans traduction : pense à traduire).');
}

function concepts() {
  const d = state.draft;
  const todo = d.cards.map((c, i) => [c, i]).filter(([c]) => !c.concept.trim());
  if (!todo.length) return status('Chaque carte a déjà un concept. Vide un concept pour en redemander un.', '');
  task('Choix des concepts…', async () => {
    const out = await call({ action: 'concepts', theme: themeOf(), labels: todo.map(([c]) => c.text) });
    const taken = new Set(d.cards.map((c) => c.concept).filter(Boolean));
    todo.forEach(([c], k) => {
      let key = out.concepts[k] || '';
      for (let n = 2; key && taken.has(key); n++) key = `${out.concepts[k]}-${n}`;
      c.concept = key;
      taken.add(key);
    });
    touch();
  }, 'Concepts proposés.');
}

async function drawMissing() {
  const d = state.draft;
  const en = d.tr.en.items;
  const cards = d.cards.filter((c) => c.concept && !state.icons[c.concept]).slice(0, 20)
    .map((c) => ({ concept: c.concept, label: en[d.cards.indexOf(c)] || c.text }));
  if (!cards.length) return;
  const out = await call({ action: 'draw', theme: d.tr.en.title || themeOf(), cards });
  Object.assign(state.icons, out.icons);
  for (const c of Object.keys(out.icons)) state.wishlist.delete(c);
  const left = cards.filter((c) => !out.icons[c.concept]).length;
  if (left) throw new Error(`${left} image(s) n’ont pas pu être dessinées : réessaie.`);
}

async function translate() {
  const d = state.draft;
  const out = await call({ action: 'translate', title: d.title, description: d.description, items: d.cards.map((c) => c.text) });
  for (const lang of Object.keys(LANGS)) d.tr[lang] = { title: out[lang].title, description: out[lang].description, items: out[lang].items.map(String) };
  touch();
}

function ideas() {
  const today = dailyDay();
  const days = Array.from({ length: AHEAD }, (_, i) => addDays(today, i + 1)).filter((x) => !state.rows.has(x)).slice(0, 6);
  if (!days.includes(state.draft.day)) days.unshift(state.draft.day);
  task('Recherche d’idées…', async () => {
    state.ideas = (await call({ action: 'ideas', count: 8, days })).ideas;
  }, 'Clique une idée pour la prendre comme thème, puis « Générer la liste ».');
}

// ---------- Save ----------
function payload() {
  const d = state.draft;
  const regions = (s) => s.split(/[\s,;]+/).map((x) => x.trim().toUpperCase()).filter(Boolean);
  const translations = {};
  for (const lang of Object.keys(LANGS)) {
    const t = d.tr[lang];
    const items = d.cards.map((c, i) => (t.items[i]?.trim() ? joinLabel(c.emoji, t.items[i]) : ''));
    const empty = !t.title.trim() && items.every((x) => !x);
    if (!empty && (!t.title.trim() || items.some((x) => !x))) {
      throw new Error(`Traduction ${lang.toUpperCase()} incomplète : complète-la, vide-la, ou clique « Tout traduire ».`);
    }
    translations[lang] = empty ? null : { title: t.title, description: t.description, items };
  }
  return {
    action: 'save', day: d.day,
    list: {
      title: d.title, emoji: d.emoji, description: d.description,
      items: d.cards.map((c) => joinLabel(c.emoji, c.text)),
      concepts: d.cards.map((c) => c.concept.trim()),
      cover: d.cover, regions: regions(d.regions), vote_regions: regions(d.vote_regions),
    },
    translations,
  };
}

$('save').addEventListener('click', () => {
  let body;
  try { body = payload(); } catch (e) { return status(e.message, 'bad'); }
  const missing = Object.entries(body.translations).filter(([, t]) => !t).map(([l]) => l.toUpperCase());
  if (missing.length && !confirm(`Pas de traduction ${missing.join(', ')} : ces joueurs verront le français. Enregistrer quand même ?`)) return;
  task('Enregistrement…', async () => {
    await call(body);
    state.dirty = false;
    await load();
    state.draft = draftOf(state.selected);
  }, 'Enregistré ✓');
});

$('delete').addEventListener('click', () => {
  const d = state.draft;
  if (!confirm(`Supprimer la liste du ${longDate(d.day)} ?`)) return;
  task('Suppression…', async () => {
    await call({ action: 'delete', day: d.day });
    state.dirty = false;
    await load();
    state.draft = draftOf(state.selected);
  }, 'Supprimée.');
});

function move() {
  const d = state.draft;
  const to = $('moveTo').value;
  if (!to) return status('Choisis une date.', 'bad');
  if (state.dirty) return status('Enregistre d’abord tes modifications.', 'bad');
  const other = state.rows.get(to);
  if (!confirm(other ? `Échanger avec « ${other.title} » du ${longDate(to)} ?` : `Déplacer au ${longDate(to)} ?`)) return;
  task('Déplacement…', async () => {
    await call({ action: 'move', from: d.day, to });
    await load();
    state.selected = to;
    state.draft = draftOf(to);
    renderDays();
  }, 'Déplacée.');
}

// ---------- Start ----------
$('editor').addEventListener('click', (e) => {
  const pic = e.target.closest('[data-cover]');
  if (pic && state.draft && !state.busy) { state.draft.cover = +pic.dataset.cover; touch(); renderEditor(); }
});
$('load').addEventListener('click', () => task('Chargement…', () => load(false), 'Listes chargées.'));
$('key').addEventListener('keydown', (e) => e.key === 'Enter' && $('load').click());
window.addEventListener('beforeunload', (e) => { if (state.dirty) e.preventDefault(); });
const saved = store.get('tiercraft-admin-key');
if (saved) { $('key').value = saved; $('load').click(); }
</script>
</body>
