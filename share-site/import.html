<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tier list partagée · Tiercraft</title>
  <meta name="description" content="Ouvrez cette tier list dans l’app Tiercraft.">
  <meta property="og:title" content="Une tier list vous attend sur Tiercraft">
  <meta property="og:description" content="Touchez le lien pour l’ouvrir dans l’app Tiercraft.">
  <meta property="og:image" content="/icon.png">
  <meta name="apple-itunes-app" content="app-id=6822017061">
  <link rel="icon" href="/icon.png">
  <style>
    :root { color-scheme: dark; --bg: #0F1115; --surface: #181B22; --border: #2C313C; --text: #F2F4F8; --muted: #9AA3B2; --primary: #7C5CFF; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 420px; text-align: center; }
    .icon { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 24px; margin: 20px 0 6px; }
    .title { color: var(--muted); margin: 0 0 24px; overflow-wrap: anywhere; }
    .strip { display: flex; gap: 4px; margin: 0 auto 24px; max-width: 220px; }
    .strip span { flex: 1; height: 4px; border-radius: 2px; }
    .btn { display: block; padding: 14px 18px; border-radius: 12px; font-weight: 600; text-decoration: none; margin-top: 12px; }
    .primary { background: var(--primary); color: #fff; }
    .secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    .hint { color: var(--muted); font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/icon.png" alt="Tiercraft">
    <h1>Une tier list vous attend</h1>
    <p class="title" id="title">Ouvrez-la dans l’app Tiercraft.</p>
    <div class="strip"><span style="background:#FF7F7F"></span><span style="background:#FFBF7F"></span><span style="background:#FFDF7F"></span><span style="background:#FFFF7F"></span><span style="background:#BFFF7F"></span></div>
    <a class="btn primary" id="store" href="https://apps.apple.com/app/id6822017061">Télécharger Tiercraft sur l’App Store</a>
    <a class="btn secondary" id="open" href="tiercraft://import">J’ai déjà l’app : ouvrir la tier list</a>
    <p class="hint">Une fois l’app installée, touchez à nouveau le lien reçu pour ajouter la tier list.</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var code = params.get('d') || '';
      if (/^[A-Za-z0-9_-]+$/.test(code)) {
        document.getElementById('open').href = 'tiercraft://import?d=' + code;
        // Show the list title: the code is base64url-encoded UTF-8 JSON (see src/lib/share.ts).
        try {
          var b64 = code.replace(/-/g, '+').replace(/_/g, '/');
          var bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
          var bytes = Uint8Array.from(bin, function (c) { return c.charCodeAt(0); });
          var data = JSON.parse(new TextDecoder().decode(bytes));
          if (typeof data.t === 'string' && data.t) document.getElementById('title').textContent = '« ' + data.t.slice(0, 60) + ' »';
        } catch (e) {}
      }
      // On iPhone/iPad, a tapped link normally opens the app directly (universal
      // link). It can still land here: link opened inside a browser or an in-app
      // web view, or iOS not having checked the domain yet. Try the app's own
      // scheme; if the page is still visible shortly after, the app isn't
      // installed: go to the App Store.
      var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (ios && code && !sessionStorage.getItem('tc-redirected')) {
        sessionStorage.setItem('tc-redirected', '1');
        var timer = setTimeout(function () { location.href = document.getElementById('store').href; }, 1800);
        document.addEventListener('visibilitychange', function () {
          if (document.hidden) clearTimeout(timer);
        });
        location.href = document.getElementById('open').href;
      }
    })();
  </script>
</body>
</html>
